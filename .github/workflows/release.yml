# Release workflow of the PUBLIC releases repo Zelyutin-Releases/YanaImagine (source copy: scripts/releases-repo/ in the
# private code repo; `node scripts/releases-repo/push.mjs` uploads it). It lives there and not in the code repo because
# required reviewers ("Approve" with one tap) and Actions minutes are free only in public repos.
# The code is checked out from the private repo with CODE_TOKEN (fine-grained PAT: that one repo, Contents read/write —
# write for the version commit and tag). Both secrets sit in the "release" environment, released only after Danil approves.
# Logs are public: nothing here prints code or secrets.
name: Релиз
# The version is in the run's title (Actions list, GitHub app, the approval request); "what's new" goes to the release page.
run-name: Релиз ${{ inputs.version || 'без номера' }}${{ (inputs.minor && ' · новые возможности') || '' }}
# Trial builds (no secrets, no approval) run in the code repo: .github/workflows/installers.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Какая версия выйдет, например 0.3.4 (сборка остановится, если выйдет другая)
        required: false
        type: string
      notes:
        description: Что нового (видно всем на странице релиза)
        required: false
        type: string
      minor:
        description: Новые возможности (0.1.x → 0.2.0), а не только исправления
        required: false
        type: boolean
        default: false
permissions:
  contents: write # this repo's releases
concurrency: release
jobs:
  release:
    name: Yana Imagine и Imagine Host ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Zelyutin/YanaImagine
          token: ${{ secrets.CODE_TOKEN }}
          fetch-depth: 0
      # electron-builder needs Wine on Linux: icon and version info in the .exe, and the NSIS uninstaller.
      - name: Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 > /dev/null
          wine --version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build, sign, publish
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          MINOR: ${{ (inputs.minor && '--minor') || '' }}
          EXPECT: ${{ inputs.version }}
          WINEDEBUG: -all
        run: |
          # The version commit and tag come from the bot: it is plain to see they are automatic.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$NOTES" ]; then node scripts/release.mjs --publish $MINOR ${EXPECT:+--expect "$EXPECT"} --notes "$NOTES"
          else node scripts/release.mjs --publish $MINOR ${EXPECT:+--expect "$EXPECT"}; fi
